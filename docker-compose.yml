services:
  postgres:
    image: postgres:16-alpine
    container_name: feedme-postgres
    environment:
      POSTGRES_DB: feedme
      POSTGRES_USER: feedme
      POSTGRES_PASSWORD: feedme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedme -d feedme"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: feedme-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: feedme-postgres-data
  redis-data:
    name: feedme-redis-data
